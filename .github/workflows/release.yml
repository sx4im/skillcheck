name: release

# Publishes @sx4im/skillcheck to npm with provenance when a version tag is pushed:
#
#   npm version patch        # bumps package.json + creates the tag
#   git push --follow-tags
#
# Requires a granular NPM_TOKEN secret with publish access. The workflow refuses
# to publish unless the tag matches the version in package.json.
on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: npm-publish-${{ github.ref }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      smoke-sha: ${{ steps.smoke.outputs.sha256 }}
    env:
      npm_config_fetch_timeout: '30000'
      npm_config_fetch_retries: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require tagged commit to be on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not an ancestor of origin/main"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Verify the tag matches package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - run: npm audit --audit-level=high
      - run: npm ci --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage

      - name: Tarball smoke test
        id: smoke
        run: |
          set -euo pipefail
          node scripts/tarball-smoke.mjs "$RUNNER_TEMP/package.tgz"
          smoke_sha="$(sha256sum "$RUNNER_TEMP/package.tgz" | cut -d ' ' -f 1)"
          echo "sha256=$smoke_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: ${{ runner.temp }}/package.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      npm_config_fetch_timeout: '30000'
      npm_config_fetch_retries: '1'
      npm_config_prefer_online: 'true'
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: ${{ runner.temp }}

      - name: Verify the smoke-tested tarball
        env:
          SMOKE_SHA: ${{ needs.prepare.outputs.smoke-sha }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$SMOKE_SHA" "$RUNNER_TEMP/package.tgz" | sha256sum -c

      - name: Check if version is already published
        id: check_version
        run: |
          set -euo pipefail
          versions="$(npm view @sx4im/skillcheck versions --json)"
          published="$(jq --arg version "${GITHUB_REF_NAME#v}" 'index($version) != null' <<< "$versions")"
          echo "already_published=$published" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (with provenance)
        if: steps.check_version.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is not set in GitHub repository secrets"
            exit 1
          fi
          npm publish "$RUNNER_TEMP/package.tgz" --ignore-scripts --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  verify:
    needs: publish
    runs-on: ubuntu-latest
    env:
      npm_config_fetch_timeout: '30000'
      npm_config_fetch_retries: '1'
      npm_config_prefer_online: 'true'
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: ${{ runner.temp }}

      - name: Verify provenance attestations
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="@sx4im/skillcheck@$version"
          predicate=""
          for attempt in $(seq 1 6); do
            predicate="$(npm view "$package" dist.attestations.provenance.predicateType || true)"
            if [[ "$predicate" == https://slsa.dev/provenance/* ]]; then
              break
            fi
            echo "Waiting for npm registry to index attestations (attempt $attempt/6)..."
            sleep 5
          done

          if [[ "$predicate" != https://slsa.dev/provenance/* ]]; then
            echo "::error::npm did not index a SLSA provenance attestation for $package"
            exit 1
          fi

          # Use a disposable project to verify the published package, with lifecycle scripts disabled.
          digest="$(sha512sum "$RUNNER_TEMP/package.tgz" | cut -d ' ' -f 1)"
          verification_dir="$(mktemp -d)"
          cd "$verification_dir"
          printf '%s\n' '{"private":true}' > package.json
          npm install "$package" --ignore-scripts --no-audit --save-exact
          npm audit signatures --json --include-attestations > verified.json
          if ! jq -e --arg version "$version" --arg digest "$digest" --arg predicate "$predicate" '
            any(.verified[]?;
              .name == "@sx4im/skillcheck" and .version == $version and
              any(.attestationBundles[]?;
                (.bundle.dsseEnvelope.payload | @base64d | fromjson) as $statement |
                $statement.predicateType == $predicate and
                any($statement.subject[]?; .digest.sha512 == $digest)))
          ' verified.json > /dev/null; then
            echo "::error::No verified SLSA attestation for the smoke-tested tarball of $package"
            exit 1
          fi
          echo "Verified npm provenance for $package"
