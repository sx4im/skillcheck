name: release

# Publishes @sx4im/skillcheck to npm with provenance when a version tag is pushed:
#
#   npm version patch        # bumps package.json + creates the tag
#   git push --follow-tags
#
# Requires an NPM_TOKEN secret (an npm automation token). The job refuses to
# publish unless the tag matches the version in package.json, so a mistyped tag
# can't ship the wrong version.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require tagged commit to be on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not an ancestor of origin/main"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Verify the tag matches package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage

      - name: Tarball smoke test
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-tarball
          node scripts/tarball-smoke.mjs /tmp/release-tarball/package.tgz
          SMOKE_SHA="$(sha256sum /tmp/release-tarball/package.tgz | awk '{print $1}')"
          echo "SMOKE_SHA=$SMOKE_SHA" >> "$GITHUB_ENV"
          echo "Smoke validated tarball SHA-256: $SMOKE_SHA"

      - name: Verify NPM_TOKEN secret
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is not set in GitHub repository secrets"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check if version is already published
        id: check_version
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          if npm view "@sx4im/skillcheck@$pkg" version >/dev/null 2>&1; then
            echo "Package @sx4im/skillcheck@$pkg is already published on npm. Skipping publish."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (with provenance)
        if: steps.check_version.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          PUBLISH_SHA="$(sha256sum /tmp/release-tarball/package.tgz | awk '{print $1}')"
          echo "Publish tarball SHA-256: $PUBLISH_SHA"
          if [ "$SMOKE_SHA" != "$PUBLISH_SHA" ]; then
            echo "::error::Tarball SHA-256 mismatch before publish! Smoke SHA: $SMOKE_SHA vs Publish SHA: $PUBLISH_SHA"
            exit 1
          fi
          npm publish /tmp/release-tarball/package.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify provenance attestations
        if: steps.check_version.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          verified=false
          for attempt in $(seq 1 6); do
            attestations="$(npm view "@sx4im/skillcheck@$pkg" dist.attestations --json 2>/dev/null || true)"
            if [ -n "$attestations" ] && [ "$attestations" != "{}" ] && [ "$attestations" != "null" ]; then
              echo "Provenance attestations verified for @sx4im/skillcheck@$pkg:"
              echo "$attestations"
              verified=true
              break
            fi
            echo "Waiting for npm registry to index attestations (attempt $attempt/6)..."
            sleep 5
          done

          if [ "$verified" != "true" ]; then
            echo "::error::npm view @sx4im/skillcheck@$pkg dist.attestations is empty. Provenance attestation was not published."
            exit 1
          fi
