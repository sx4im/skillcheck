name: ci

# Per-commit quality gate: lint, typecheck, coverage, and a clean build on every
# push to main and every pull request. (The separate rot.yml runs the live corpus
# on a weekly schedule and needs the NVIDIA secret — this one never makes model
# calls, so it runs for forks and PRs too.)
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint GitHub Actions workflows
        if: matrix.node == '20'
        run: |
          set -euo pipefail
          mkdir -p /tmp/actionlint-bin
          curl -fsSL --max-time 60 -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tar.gz" | sha256sum -c
          tar -xzf /tmp/actionlint.tar.gz -C /tmp/actionlint-bin actionlint
          /tmp/actionlint-bin/actionlint

      - name: Typecheck (src + tests)
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Smoke-test the built binary
        run: |
          node dist/bin/skillcheck.js --version
          help_out="$(node dist/bin/skillcheck.js --help)"
          grep -q "Usage" <<< "$help_out"

  windows-build:
    name: Windows build and test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node dist/bin/skillcheck.js --version
      - run: node dist/bin/skillcheck.js --help

  package:
    name: Package validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      audit-artifact: ${{ steps.save-audit.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Run packaged CLI against the mock model
        run: node scripts/tarball-smoke.mjs

      - name: Audit the companion skill
        id: audit
        run: |
          status=0
          node dist/bin/skillcheck.js audit skills/skillcheck/SKILL.md --format sarif --output "$RUNNER_TEMP/skillcheck.sarif" || status=$?
          if [[ -s "$RUNNER_TEMP/skillcheck.sarif" ]]; then
            echo "report-written=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Save the audit report for code scanning
        id: save-audit
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.audit.outputs.report-written == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skillcheck-sarif
          path: ${{ runner.temp }}/skillcheck.sarif
          if-no-files-found: error
          retention-days: 1

      # Confirm the published tarball contains the executable entrypoint and
      # nothing unintended (no src/tests/secrets), and that a publish would succeed.
      - name: Inspect the publish tarball
        run: |
          set -euo pipefail
          files="$(npm pack --dry-run --json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{for(const f of JSON.parse(d)[0].files)console.log(f.path)})")"
          echo "$files"
          grep -qx "dist/bin/skillcheck.js" <<< "$files"
          grep -qx "README.md" <<< "$files"
          if grep -qE "(^|/)\.env|packages/cli/test/" <<< "$files"; then
            echo "::error::tarball contains files that should not be published"
            exit 1
          fi
      - run: npm publish --dry-run

  skill-audit-upload:
    name: Upload skill audit to code scanning
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.package.outputs.audit-artifact != '' }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skillcheck-sarif
          path: ${{ runner.temp }}
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: ${{ runner.temp }}/skillcheck.sarif
          category: skillcheck-audit

  dependency-security:
    name: Dependency security (${{ matrix.directory }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', dashboard]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    env:
      npm_config_fetch_timeout: '30000'
      npm_config_fetch_retries: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate the lockfile and package integrity
        run: npm ci --ignore-scripts --no-audit
      - name: Audit dependencies
        run: npm audit --audit-level=high

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      - name: Typecheck (JSDoc + checkJs)
        run: npm run typecheck

      - name: Test (offline smoke + proxy + verify)
        run: npm test
